# Constrói os instaladores (Windows .exe e macOS .dmg) e publica-os numa Release.
# Para lançar uma versão: atualizar "version" no package.json, criar a etiqueta (ex.: v1.0.1) e fazer push da etiqueta.
name: Instaladores

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  instaladores:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            alvo: --win
            ficheiros: release/*.exe
          - os: macos-latest
            alvo: --mac
            ficheiros: release/*.dmg
    runs-on: ${{ matrix.os }}
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Construir a aplicação
        run: npx vite build
      - name: Construir o instalador
        run: npx electron-builder ${{ matrix.alvo }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-${{ matrix.os }}
          path: ${{ matrix.ficheiros }}
      - name: Anexar à Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.ficheiros }}
